version: "3.9"

services:

  accreditation-api:

    container_name: rvsk_accreditation_v2

    build:
      context: .
      dockerfile: Dockerfile

    image: rvsk_accreditation_v2:latest

    restart: always

    env_file:
      - .env

    ports:
      - "3000:3000"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://localhost:3000/accreditation/api/v1/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 5

    networks:
      - rvsk-network

networks:

  rvsk-network:
    driver: bridge
